<!doctype html>
<html lang="pl" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="description" content="Meme soundboard Pepe-PL" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Meme Soundboard</title>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="wordmark" href="./" aria-label="Meme Soundboard, strona główna">
          <span class="wordmark__mark" aria-hidden="true">WS</span>
          <span>WEB SOUNDBOARD</span>
        </a>
        <div class="topbar__right">
          <div class="theme-switch" role="group" aria-label="Motyw strony">
            <button class="theme-option" type="button" data-theme-choice="system" aria-label="Motyw systemowy" title="Motyw systemowy">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
            </button>
            <button class="theme-option" type="button" data-theme-choice="light" aria-label="Jasny motyw" title="Jasny motyw">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
            </button>
            <button class="theme-option" type="button" data-theme-choice="dark" aria-label="Ciemny motyw" title="Ciemny motyw">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"></path></svg>
            </button>
          </div>
          <div class="connection"><span class="connection__dot" aria-hidden="true"></span> PEPE-PL / ARCHIVE</div>
        </div>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <div class="intro__copy">
            <p class="eyebrow">YOUR POCKET SOUND MACHINE</p>
            <h1 id="page-title">MEME<br /><span>SOUNDBOARD</span></h1>
          </div>
          <div class="clip-count" aria-live="polite">
            <span class="clip-count__number" id="clip-count">--</span>
            <span class="clip-count__label">CLIPS<br />IN DECK</span>
          </div>
        </section>

        <section class="controls" aria-label="Sterowanie dźwiękami">
          <label class="search-box">
            <span class="search-box__prefix" aria-hidden="true">FIND</span>
            <input id="search" type="search" placeholder="Szukaj dźwięku" autocomplete="off" />
            <kbd class="search-box__key" aria-hidden="true">/</kbd>
          </label>
          <div class="control-actions">
            <button class="utility-button utility-button--refresh" id="refresh-button" type="button">
              <span class="refresh-symbol" aria-hidden="true">↻</span> Odśwież
            </button>
          </div>
        </section>

        <div class="status-line" id="status" role="status" aria-live="polite">
          <span class="status-line__pulse" aria-hidden="true"></span>
          <span>Ładowanie biblioteki</span>
        </div>

        <section class="sound-grid" id="sound-grid" aria-label="Dźwięki" aria-busy="true"></section>
        <p class="empty-state" id="empty-state" hidden>Nie znaleziono pasujących dźwięków.</p>
      </main>

      <footer class="footer">
        <a class="footer__repo" href="https://github.com/Pepe-PL/WebSoundboard" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.3 9.38 7.88 10.9.58.1.79-.25.79-.56v-2.1c-3.2.7-3.88-1.35-3.88-1.35-.53-1.34-1.3-1.7-1.3-1.7-1.07-.73.08-.72.08-.72 1.18.08 1.8 1.2 1.8 1.2 1.05 1.8 2.76 1.28 3.43.98.1-.77.41-1.28.75-1.58-2.55-.3-5.24-1.28-5.24-5.7 0-1.25.45-2.28 1.2-3.08-.12-.3-.52-1.48.11-3.05 0 0 .98-.31 3.2 1.18a11.1 11.1 0 0 1 5.83 0c2.22-1.5 3.2-1.18 3.2-1.18.64 1.57.24 2.75.12 3.05.75.8 1.2 1.83 1.2 3.08 0 4.43-2.7 5.4-5.27 5.7.42.36.8 1.06.8 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"></path></svg>
          <span>Pepe-PL/WebSoundboard</span>
        </a>
        <span id="footer-state">SOUND SYSTEM / CONNECTING</span>
      </footer>
    </div>
  </body>
</html>
