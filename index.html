<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="description" content="Meme soundboard Pepe-PL" />
    <link rel="icon" href="./icon.svg?v=3f2b517" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Meme Soundboard</title>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="wordmark" href="./" aria-label="Meme Soundboard, strona główna">
          <img class="wordmark__mark" src="./icon.svg?v=3f2b517" alt="" aria-hidden="true" />
          <span>WEB SOUNDBOARD</span>
        </a>
        <div class="topbar__right">
          <div class="theme-switch" role="group" aria-label="Color theme">
            <button class="theme-option" type="button" data-theme-choice="system" aria-label="System theme" title="System theme">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
            </button>
            <button class="theme-option" type="button" data-theme-choice="light" aria-label="Light theme" title="Light theme">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
            </button>
            <button class="theme-option" type="button" data-theme-choice="dark" aria-label="Dark theme" title="Dark theme">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z"></path></svg>
            </button>
          </div>
          <div class="connection"><span class="connection__dot" aria-hidden="true"></span> PEPE-PL / ARCHIVE</div>
        </div>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <div class="intro__copy">
            <p class="eyebrow">YOUR POCKET SOUND MACHINE</p>
            <h1 id="page-title">MEME<br /><span>SOUNDBOARD</span></h1>
          </div>
          <div class="clip-count" aria-live="polite">
            <span class="clip-count__number" id="clip-count">--</span>
            <span class="clip-count__label">CLIPS<br />IN DECK</span>
          </div>
        </section>

        <section class="controls" aria-label="Sound controls">
          <label class="search-box">
            <span class="search-box__prefix" aria-hidden="true">FIND</span>
            <input id="search" type="search" placeholder="Search sounds" autocomplete="off" />
            <kbd class="search-box__key" aria-hidden="true">/</kbd>
          </label>
          <label class="volume-control" for="master-volume" title="Master volume">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4Z"></path><path d="M16 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"></path></svg>
            <input id="master-volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Master volume" />
            <output id="volume-value" for="master-volume">80%</output>
          </label>
          <div class="control-actions">
            <button class="utility-button utility-button--refresh" id="refresh-button" type="button">
              <span class="refresh-symbol" aria-hidden="true">↻</span> Refresh
            </button>
          </div>
        </section>

        <section class="category-strip" aria-label="Filter sounds by category">
          <div class="category-tabs" id="category-tabs" role="tablist" aria-label="Categories"></div>
          <button class="add-category-button" id="add-category-button" type="button" aria-label="Add category" title="New category">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"></path></svg>
            <span>New category</span>
          </button>
        </section>

        <div class="status-line" id="status" role="status" aria-live="polite">
          <span class="status-line__pulse" aria-hidden="true"></span>
          <span>Loading library</span>
        </div>

        <section class="sound-grid" id="sound-grid" aria-label="Sounds" aria-busy="true"></section>
        <p class="empty-state" id="empty-state" hidden>No matching sounds found.</p>
      </main>

      <dialog class="category-dialog" id="category-dialog" aria-labelledby="category-dialog-title">
        <form class="category-dialog__surface" id="category-dialog-form">
          <div class="category-dialog__header">
            <div>
              <p class="eyebrow">SOUND ORGANIZER</p>
              <h2 id="category-dialog-title">New category</h2>
            </div>
            <button class="dialog-close" id="category-dialog-close" type="button" aria-label="Close">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"></path></svg>
            </button>
          </div>
          <p class="category-dialog__description" id="category-dialog-description"></p>
          <label class="category-name-field" id="category-name-field">
            <span>Category name</span>
            <input id="category-name" type="text" maxlength="32" autocomplete="off" required />
          </label>
          <label class="category-color-field" id="category-color-field">
            <span>Category color</span>
            <input id="category-color" type="color" value="#d6f05a" aria-label="New category color" />
          </label>
          <p class="category-dialog__error" id="category-dialog-error" role="alert" hidden></p>
          <div class="category-options" id="category-options" hidden></div>
          <div class="category-management-controls" id="category-management-controls" hidden>
            <div class="category-order-controls">
              <button class="category-order-button" id="category-move-left" type="button" aria-label="Move category earlier" title="Move earlier">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12.5 4-6 6 6 6"></path></svg>
                <span>Move earlier</span>
              </button>
              <button class="category-order-button" id="category-move-right" type="button" aria-label="Move category later" title="Move later">
                <span>Move later</span>
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4 6 6-6 6"></path></svg>
              </button>
            </div>
            <button class="category-delete-button" id="category-delete" type="button">Delete category</button>
          </div>
          <div class="category-dialog__actions">
            <button class="dialog-cancel" id="category-dialog-cancel" type="button">Cancel</button>
            <button class="dialog-save" id="category-dialog-save" type="submit">Add category</button>
          </div>
        </form>
      </dialog>

      <footer class="footer">
        <a class="footer__repo" href="https://github.com/Pepe-PL/WebSoundboard" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.3 9.38 7.88 10.9.58.1.79-.25.79-.56v-2.1c-3.2.7-3.88-1.35-3.88-1.35-.53-1.34-1.3-1.7-1.3-1.7-1.07-.73.08-.72.08-.72 1.18.08 1.8 1.2 1.8 1.2 1.05 1.8 2.76 1.28 3.43.98.1-.77.41-1.28.75-1.58-2.55-.3-5.24-1.28-5.24-5.7 0-1.25.45-2.28 1.2-3.08-.12-.3-.52-1.48.11-3.05 0 0 .98-.31 3.2 1.18a11.1 11.1 0 0 1 5.83 0c2.22-1.5 3.2-1.18 3.2-1.18.64 1.57.24 2.75.12 3.05.75.8 1.2 1.83 1.2 3.08 0 4.43-2.7 5.4-5.27 5.7.42.36.8 1.06.8 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"></path></svg>
          <span>Pepe-PL/WebSoundboard</span>
        </a>
        <span id="footer-state">SOUND SYSTEM / CONNECTING</span>
      </footer>
    </div>
  </body>
</html>
