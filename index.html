<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="description" content="Meme soundboard Pepe-PL" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Meme Soundboard</title>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="wordmark" href="./" aria-label="Meme Soundboard, strona główna">
          <span class="wordmark__mark" aria-hidden="true">WS</span>
          <span>WEB SOUNDBOARD</span>
        </a>
        <div class="connection"><span class="connection__dot" aria-hidden="true"></span> PEPE-PL / ARCHIVE</div>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <div class="intro__copy">
            <p class="eyebrow">YOUR POCKET SOUND MACHINE</p>
            <h1 id="page-title">MEME<br /><span>SOUNDBOARD</span></h1>
          </div>
          <div class="clip-count" aria-live="polite">
            <span class="clip-count__number" id="clip-count">--</span>
            <span class="clip-count__label">CLIPS<br />IN DECK</span>
          </div>
        </section>

        <section class="controls" aria-label="Sterowanie dźwiękami">
          <label class="search-box">
            <span class="search-box__prefix" aria-hidden="true">FIND</span>
            <input id="search" type="search" placeholder="Szukaj dźwięku" autocomplete="off" />
            <kbd class="search-box__key" aria-hidden="true">/</kbd>
          </label>
          <div class="control-actions">
            <button class="utility-button" id="stop-button" type="button" disabled>Zatrzymaj</button>
            <button class="utility-button utility-button--refresh" id="refresh-button" type="button">
              <span class="refresh-symbol" aria-hidden="true">↻</span> Odśwież
            </button>
          </div>
        </section>

        <div class="status-line" id="status" role="status" aria-live="polite">
          <span class="status-line__pulse" aria-hidden="true"></span>
          <span>Ładowanie biblioteki</span>
        </div>

        <section class="sound-grid" id="sound-grid" aria-label="Dźwięki" aria-busy="true"></section>
        <p class="empty-state" id="empty-state" hidden>Nie znaleziono pasujących dźwięków.</p>
      </main>

      <footer class="footer">
        <span>WEB SOUNDBOARD <span class="footer__year">/ 2026</span></span>
        <span id="footer-state">SOUND SYSTEM / CONNECTING</span>
      </footer>
    </div>
  </body>
</html>
